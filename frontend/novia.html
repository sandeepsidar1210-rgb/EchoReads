<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novia AI Assistant — EchoReads</title>
  <meta name="description" content="Chat with Novia, your AI-powered literary assistant. Get personalized book recommendations powered by Gemini 2.5 Flash." />
  <link rel="stylesheet" href="css/shared.css" />
  <script src="js/shared.js" defer></script>
  <style>
    .chat-bubble-ai {
      background: rgba(34,211,238,0.08);
      border: 1px solid rgba(34,211,238,0.2);
      border-radius: 18px 18px 18px 4px;
      padding: 14px 18px;
      max-width: 80%;
      font-size: 0.875rem;
      line-height: 1.7;
      color: var(--color-text-primary);
    }
    .chat-bubble-user {
      background: rgba(245,183,49,0.12);
      border: 1px solid rgba(245,183,49,0.22);
      border-radius: 18px 18px 4px 18px;
      padding: 14px 18px;
      max-width: 80%;
      font-size: 0.875rem;
      line-height: 1.7;
      align-self: flex-end;
      color: var(--color-text-primary);
    }
    .typing-dot {
      width: 7px; height: 7px;
      background: var(--color-teal);
      border-radius: 50%;
      animation: typing-bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-7px); opacity: 1; }
    }
    .chat-container {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 160px);
      max-height: 780px;
    }
    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(34,211,238,0.04);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
    }
    .chat-input-wrap {
      padding: 16px 20px;
      border-top: 1px solid var(--color-border);
      display: flex;
      gap: 10px;
      background: rgba(5,5,15,0.5);
    }
    .chat-send-btn {
      padding: 11px 20px;
      background: var(--gradient-teal);
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: var(--radius-full);
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: filter var(--transition-fast), transform var(--transition-fast);
    }
    .chat-send-btn:hover { filter: brightness(1.1); transform: scale(1.03); }
    .quick-chip {
      padding: 7px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .quick-chip:hover {
      background: rgba(34,211,238,0.1);
      border-color: rgba(34,211,238,0.3);
      color: var(--color-teal);
    }
    .novia-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #10b981);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .online-dot {
      width: 9px; height: 9px;
      background: var(--color-emerald);
      border-radius: 50%;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.4);
    }
  </style>
  <script src="js/main.js"></script>
</head>
<body>
<div class="er-page">

  <!-- Main Chat Section -->
  <main style="padding: 24px 32px 40px; max-width: 900px; margin: 0 auto; flex:1; display:flex; flex-direction:column;">
    <!-- Page title -->
    <div style="margin-bottom: 20px;">
      <div class="er-badge er-badge-teal" style="margin-bottom:10px;display:inline-flex;">🤖 Powered by Gemini 2.5 Flash</div>
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:900;margin-bottom:4px;">Novia <span class="text-gradient-teal">AI</span> Assistant</h1>
      <p style="color:var(--color-text-secondary);font-size:.85rem;">Ask me about books, get recommendations, or explore genres.</p>
    </div>

    <div class="chat-container" style="flex:1;">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="novia-avatar">🤖</div>
        <div>
          <div style="font-weight:700;font-size:.95rem;">Novia AI</div>
          <div style="font-size:.75rem;color:var(--color-text-secondary);">EchoReads Smart Literary Assistant</div>
        </div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
          <div class="online-dot"></div>
          <span style="font-size:.75rem;color:var(--color-emerald);font-weight:600;">Online</span>
        </div>
      </div>

      <!-- Quick prompts -->
      <div style="padding:12px 20px;border-bottom:1px solid var(--color-border);display:flex;flex-wrap:wrap;gap:8px;">
        <button class="quick-chip" data-prompt="recommend a classic horror novel">👻 Recommend Horror</button>
        <button class="quick-chip" data-prompt="suggest a romance book with high rating">💕 High-Rated Romance</button>
        <button class="quick-chip" data-prompt="recommend science fiction books in your catalog">🚀 Suggest Sci-Fi</button>
        <button class="quick-chip" data-prompt="give me a popular book suggestion">⭐ Popular Books</button>
        <button class="quick-chip" data-prompt="what mystery books do you have?">🔍 Mystery</button>
      </div>

      <!-- Messages Area -->
      <div id="messages" class="chat-messages"></div>

      <!-- Typing indicator -->
      <div id="typing" style="display:none;padding:0 24px 12px;align-items:center;gap:8px;">
        <div class="novia-avatar" style="width:28px;height:28px;font-size:.8rem;">🤖</div>
        <div style="display:flex;gap:5px;align-items:center;padding:10px 14px;background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.2);border-radius:12px;">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>

      <!-- Input controls -->
      <div class="chat-input-wrap">
        <input id="input" class="er-input" style="border-radius:var(--radius-full);" placeholder="Ask about books, genres, authors…" />
        <button id="send" class="chat-send-btn">Send ↑</button>
      </div>
    </div>
  </main>

  <!-- Container for the Book Details Modal -->
  <div id="book-details-modal" class="relative z-50"></div>

  <script>
    const token = localStorage.getItem('echoreads_token');
    if (!token) {
        window.location.href = 'signin.html';
    }
    const API = '/api/novia/chat';
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const typing = document.getElementById('typing');

    // Creates chat speech bubble containing text
    function bubble(text, isUser = false) {
      const row = document.createElement('div');
      row.style.cssText = `display:flex;justify-content:${isUser ? 'flex-end' : 'flex-start'};`;

      const cardContainer = document.createElement('div');
      cardContainer.style.cssText = 'display:flex;flex-direction:column;gap:10px;max-width:80%;';

      const bubbleBox = document.createElement('div');
      bubbleBox.className = isUser ? 'chat-bubble-user' : 'chat-bubble-ai';

      let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      const { cleanText, bookIds } = parseBookTags(formattedText);
      bubbleBox.innerHTML = cleanText;

      cardContainer.appendChild(bubbleBox);
      row.appendChild(cardContainer);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;

      if (!isUser && bookIds && bookIds.length > 0) {
        bookIds.forEach(id => renderInlineBookCard(id, cardContainer));
      }
    }

    // Helper to extract [BookID: XXX] pattern from LLM response
    function parseBookTags(text) {
      const regex = /\[BookID:\s*([a-f\d]{24})\]/gi;
      let bookIds = [];
      let match;
      while ((match = regex.exec(text)) !== null) {
        bookIds.push(match[1]);
      }
      const cleanText = text.replace(regex, '');
      return { cleanText, bookIds };
    }

    // Fetch and render rich media inline book card inside chat stream
    async function renderInlineBookCard(bookId, container) {
      try {
        const response = await fetch(`/api/books/${bookId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const json = await response.json();
        if (json.success && json.data) {
          const book = json.data;
          const card = document.createElement('div');
          card.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px;background:rgba(34,211,238,0.06);border:1px solid rgba(34,211,238,0.2);border-radius:14px;max-width:320px;transition:border-color 0.2s;';
          card.onmouseenter = () => card.style.borderColor = 'rgba(34,211,238,0.5)';
          card.onmouseleave = () => card.style.borderColor = 'rgba(34,211,238,0.2)';
          card.innerHTML = `
            <img src="${book.imageUrl}" style="width:40px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0;" />
            <div style="flex:1;min-width:0;">
              <h4 style="font-size:.8rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;">${book.title}</h4>
              <p style="font-size:.72rem;color:var(--color-text-secondary);margin-bottom:6px;">by ${book.author}</p>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="color:var(--color-gold);font-size:.72rem;">★ ${book.rating}</span>
                <span style="color:var(--color-emerald);font-size:.78rem;font-weight:700;">$${book.price.toFixed(2)}</span>
              </div>
            </div>
            <button onclick="showBookDetails('${book._id}')" style="padding:6px 12px;background:var(--gradient-teal);color:#000;border:none;border-radius:20px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap;">
              View
            </button>
          `;
          container.appendChild(card);
          messages.scrollTop = messages.scrollHeight;
        }
      } catch (err) {
        console.error('Failed to load inline book card for ID ' + bookId, err);
      }
    }

    async function send(msg) {
      const text = (msg ?? input.value).trim();
      if (!text) return;
      input.value = '';
      bubble(text, true);
      typing.style.display = 'flex';

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.style.display = 'none';
        bubble(data.response || 'Sorry, I couldn\'t process that request.');
      } catch {
        typing.style.display = 'none';
        bubble('I encountered an error connecting to Novia. Please try again.');
      }
    }

    sendBtn.onclick = () => send();
    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') send();
    });
    document.querySelectorAll('[data-prompt]').forEach(btn => {
      btn.onclick = () => send(btn.dataset.prompt);
    });

    bubble("Hi! I'm Novia \ud83d\udc4b\u2014 your AI literary guide. Ask me for book recommendations, plot summaries, or say things like 'best horror novels' or 'show me romance books under $10'. I'll search our catalog and suggest the perfect read!");
  </script>
</div>
</body>
</html>
