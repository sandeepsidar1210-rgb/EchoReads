<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — EchoReads</title>
  <meta name="description" content="Review your selected books and proceed to checkout on EchoReads." />
  <link rel="stylesheet" href="css/shared.css" />
  <script src="js/shared.js" defer></script>
  <style>
    .glass {
      background: var(--color-bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
    }
    .empty-cart-icon { font-size: 5rem; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .cart-item-card {
      display: flex; gap: 16px; align-items: center;
      padding: 16px 20px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      transition: border-color var(--transition-base);
    }
    .cart-item-card:hover { border-color: var(--color-border-hover); }
  </style>
</head>
<body>
<div class="er-page">

  <main style="padding: 48px 32px 80px; max-width: 1100px; margin: 0 auto; flex: 1;">
    <div style="margin-bottom: 32px;">
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:2.2rem;font-weight:900;margin-bottom:6px;">Shopping Cart</h1>
      <p style="color:var(--color-text-secondary);font-size:.9rem;">Review your selected literary works before unlocking digital access.</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start;">
      <!-- Items -->
      <div id="cart-list" style="display:flex;flex-direction:column;gap:14px;">
        <!-- Skeletons while loading -->
        <div class="er-skeleton" style="height:90px;"></div>
        <div class="er-skeleton" style="height:90px;"></div>
        <div class="er-skeleton" style="height:90px;"></div>
      </div>
      <!-- Summary -->
      <div class="glass" style="padding:24px;position:sticky;top:calc(var(--nav-height) + 16px);">
        <h3 style="font-size:1rem;font-weight:700;padding-bottom:16px;border-bottom:1px solid var(--color-border);margin-bottom:16px;">Order Summary</h3>
        <div id="cart-totals-area">
          <p style="font-size:.85rem;color:var(--color-text-secondary);">Add books to your cart to begin checkout.</p>
        </div>
      </div>
    </div>
  </main>

    <script>
        const token = localStorage.getItem('echoreads_token');
        if (!token) {
            window.location.href = 'signin.html';
        }
        const API_BASE = '/api';

        async function fetchCart() {
            try {
                const response = await fetch(`${API_BASE}/cart/mine`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    displayCart(data.data);
                } else {
                    console.error('Failed to fetch cart:', data.message);
                }
            } catch (error) {
                console.error('Error fetching cart:', error);
            }
        }

        function displayCart(items) {
            const cartList = document.getElementById('cart-list');
            const totalsArea = document.getElementById('cart-totals-area');
            cartList.innerHTML = '';

            if (!items || items.length === 0) {
                cartList.innerHTML = `
                    <div style="text-align:center;padding:64px 24px;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-xl);">
                      <div class="empty-cart-icon">🛒</div>
                      <h3 style="font-size:1.2rem;font-weight:700;margin-bottom:8px;">Your cart is empty</h3>
                      <p style="color:var(--color-text-secondary);font-size:.875rem;margin-bottom:24px;">Discover your next favorite book and add it here.</p>
                      <a href="browse.html" class="er-btn er-btn-primary">Browse Books</a>
                    </div>
                `;
                totalsArea.innerHTML = `<p style="font-size:.85rem;color:var(--color-text-secondary);">Add books to begin checkout.</p>`;
                return;
            }

            let total = 0;
            items.forEach(item => {
                const book = item.book || {};
                const itemTotal = book.price ? (book.price * item.quantity) : 0;
                total += itemTotal;

                const itemCard = document.createElement('div');
                itemCard.className = 'cart-item-card';
                itemCard.innerHTML = `
                  ${book.imageUrl ? `<img src="${book.imageUrl}" style="width:52px;height:72px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0;" />` : '<div style="width:52px;height:72px;background:var(--color-surface);border-radius:var(--radius-sm);flex-shrink:0;"></div>'}
                  <div style="flex:1;min-width:0;">
                    <h4 style="font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;">${book.title || 'Unknown Book'}</h4>
                    <p style="font-size:.78rem;color:var(--color-text-secondary);margin-bottom:8px;">by ${book.author || 'N/A'}</p>
                    <span class="er-badge er-badge-emerald">Digital Access</span>
                  </div>
                  <div style="text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
                    <span style="font-size:1rem;font-weight:800;color:var(--color-gold);">$${itemTotal.toFixed(2)}</span>
                    <button onclick="removeFromCart('${item._id}')" style="font-size:.75rem;color:var(--color-rose);font-weight:600;background:none;border:none;cursor:pointer;padding:4px 0;">✕ Remove</button>
                  </div>
                `;
                cartList.appendChild(itemCard);
            });

            totalsArea.innerHTML = `
                <div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:10px;">
                  <span style="color:var(--color-text-secondary);">Subtotal</span>
                  <span>$${total.toFixed(2)}</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.85rem;padding-bottom:14px;border-bottom:1px solid var(--color-border);">
                  <span style="color:var(--color-text-secondary);">Digital Delivery</span>
                  <span style="color:var(--color-emerald);font-weight:700;">FREE</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding-top:14px;margin-bottom:20px;">
                  <span style="font-weight:700;">Total</span>
                  <span style="font-size:1.4rem;font-weight:900;color:var(--color-gold);">$${total.toFixed(2)}</span>
                </div>
                <button onclick="window.location.href='checkout.html'" class="er-btn er-btn-teal" style="width:100%;justify-content:center;font-size:.9rem;padding:14px;">
                  Proceed to Checkout →
                </button>
                <p style="text-align:center;font-size:.72rem;color:var(--color-text-muted);margin-top:10px;">🔒 Secured by Stripe</p>
            `;
        }

        async function removeFromCart(itemId) {
            try {
                const response = await fetch(`${API_BASE}/cart/${itemId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    fetchCart();
                } else {
                    alert('Failed to remove item');
                }
            } catch (error) {
                console.error('Error removing item:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchCart);
    </script>
</div>
</body>
</html>
