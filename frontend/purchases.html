<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Purchases - EchoReads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:radial-gradient(at 70% 30%, #171730, #0a0a1a);color:#e2e8f0;font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-800/80 bg-slate-900/40 sticky top-0 z-40">
    <div class="container mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-amber-400">Echo<span class="text-white">Reads</span></a>
      <nav class="space-x-4 text-gray-300 flex items-center">
        <a class="hover:text-white" href="browse.html">Browse</a>
        <a class="hover:text-white" href="genres.html">Genres</a>
        <a class="hover:text-white" href="cart.html">Cart</a>
        <a class="hover:text-white" href="novia.html">Novia</a>
        <a class="text-amber-400" href="purchases.html">My Purchases</a>
        <button id="signout" class="ml-4 px-3 py-1 rounded-full border border-rose-500 text-rose-300 hover:bg-rose-600/20">Sign Out</button>
      </nav>
    </div>
  </header>
  <main class="container mx-auto px-6 py-10">
    <h1 class="text-4xl font-extrabold text-white mb-6">My Purchases</h1>
    <div class="max-w-3xl">
      <div class="flex gap-2 mb-6">
        <input id="q" class="flex-1 bg-gray-700 rounded px-4 py-2 text-white" placeholder="Search purchases (title/genre)" />
        <button id="go" class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-500">Search</button>
      </div>
    </div>
    <div id="list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div id="empty" class="hidden text-gray-400">No purchases yet.</div>
  </main>
  <script>
    const token = localStorage.getItem('echoreads_token');
    if (!token) {
        window.location.href = 'signin.html';
    }
    const API='/api/purchases/mine';
    
    function card(p){ 
      const b=p.book||{}; 
      return `
      <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg border border-gray-700/50 hover:border-cyan-500/30 transition duration-350">
        ${b.imageUrl ? `<img src="${b.imageUrl}" alt="${b.title||'Book cover'}" class="w-full h-40 object-cover" />` : ''}
        <div class="p-4 flex flex-col justify-between h-[210px]">
          <div>
            <h3 class="text-base font-semibold text-white truncate">${b.title||'Unknown Title'}</h3>
            <p class="text-xs text-gray-400 truncate mb-2">${b.genre||''}</p>
            <div class="space-y-1 text-xs text-gray-400">
              <p>Address: <span class="text-gray-300 font-medium">${p.address || 'N/A'}</span></p>
              <p>Payment: <span class="text-gray-300 font-medium">${p.paymentMethod || 'N/A'}</span></p>
            </div>
          </div>
          <div>
            <div class="flex items-center justify-between text-xs border-t border-gray-700/60 pt-2 mb-3">
              <span class="text-amber-400 font-extrabold text-sm">$${(p.price||0).toFixed(2)}</span>
              <span class="text-gray-500">${new Date(p.createdAt).toLocaleDateString()}</span>
            </div>
            ${b._id ? `
              <button onclick="openReader('${b._id}')" class="w-full bg-gradient-to-r from-cyan-600 to-emerald-600 hover:from-cyan-500 hover:to-emerald-500 text-white font-semibold py-2 px-3 rounded-lg text-xs tracking-wider transition">
                READ BOOK 📖
              </button>
            ` : ''}
          </div>
        </div>
      </div>`; 
    }
    
    let ALL=[];

    // Verify Stripe checkout sessions on redirect
    async function verifyStripe() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('stripe_success') === 'true' && params.get('session_id')) {
        const sessionId = params.get('session_id');
        const listEl = document.getElementById('list');
        listEl.innerHTML = '<div class="col-span-full text-center text-cyan-400 font-bold p-10 animate-pulse text-lg">Verifying payment... unlocking your library...</div>';
        
        try {
          const res = await fetch('/api/purchases/verify-stripe-checkout', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ sessionId })
          });
          const data = await res.json();
          if (data.success) {
            alert('Stripe payment verified successfully! Your book purchases are active.');
          } else {
            alert('Verification failed: ' + data.message);
          }
        } catch (err) {
          console.error('Error verifying Stripe checkout:', err);
          alert('Failed to complete Stripe verification.');
        }
        
        // Remove query parameters from URL without page reload
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    async function load(){
      await verifyStripe();
      try {
        const r=await fetch(API,{headers:{'Authorization':`Bearer ${token}`}}); 
        const d=await r.json();
        ALL=(d.data||[]);
        render(ALL);
      } catch (err) {
        console.error(err);
      }
    }

    function render(items){
      const el=document.getElementById('list');
      el.innerHTML=items.map(card).join('');
      document.getElementById('empty').classList.toggle('hidden', !!items.length);
    }

    function search(){
      const q=document.getElementById('q').value.toLowerCase();
      render(ALL.filter(p=> ((p.book?.title||'') + (p.book?.genre||'')).toLowerCase().includes(q)));
    }

    function openReader(bookId) {
      window.location.href = `reader.html?bookId=${bookId}`;
    }

    document.getElementById('go').onclick=search;
    document.getElementById('q').addEventListener('keypress',e=>{ if(e.key==='Enter') search(); });
    document.getElementById('signout').onclick=()=>{ 
      localStorage.removeItem('echoreads_token');
      localStorage.removeItem('echoreads_user');
      window.location.href='index.html';
    };
    
    load();
  </script>
</body>
</html>
