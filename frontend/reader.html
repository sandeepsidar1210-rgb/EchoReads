<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader & Audiobook - EchoReads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Reader Layout CSS variables for dynamic sizing and themes */
    :root {
      --reader-bg: #111827;
      --reader-text: #e5e7eb;
      --reader-font-size: 1.125rem; /* 18px */
    }

    body {
      background-color: var(--reader-bg);
      color: var(--reader-text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    .theme-light {
      --reader-bg: #f9fafb;
      --reader-text: #1f2937;
    }

    .theme-dark {
      --reader-bg: #111827;
      --reader-text: #e5e7eb;
    }

    .theme-sepia {
      --reader-bg: #f7f3e9;
      --reader-text: #433422;
    }

    #reader-content {
      font-size: var(--reader-font-size);
      line-height: 1.85;
    }

    .reader-sentence {
      border-radius: 4px;
      padding: 0 2px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col theme-dark">

  <!-- Main Sticky Reader Header -->
  <header class="sticky top-0 z-40 bg-gray-900 border-b border-gray-800 text-gray-100 shadow-md">
    <div class="container mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <button onclick="window.history.back()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-3.5 py-2 rounded-full font-medium transition">
          ← Back
        </button>
        <span class="text-lg font-bold tracking-tight text-emerald-400">Echo<span class="text-white">Reads</span> Reader</span>
      </div>

      <!-- Controls Panel (Size, Theme) -->
      <div class="flex items-center flex-wrap gap-4 text-xs font-semibold">
        <!-- Font Size Controls -->
        <div class="flex items-center space-x-1 bg-gray-800 p-1 rounded-lg border border-gray-700">
          <button onclick="changeFontSize(-0.125)" class="px-2.5 py-1 text-gray-300 hover:text-white hover:bg-gray-700 rounded transition font-bold text-sm">A-</button>
          <span class="text-gray-400 px-1 font-medium">Size</span>
          <button onclick="changeFontSize(0.125)" class="px-2.5 py-1 text-gray-300 hover:text-white hover:bg-gray-700 rounded transition font-bold text-sm">A+</button>
        </div>

        <!-- Theme Selection buttons -->
        <div class="flex items-center space-x-1 bg-gray-800 p-1 rounded-lg border border-gray-700">
          <button onclick="setTheme('light')" class="px-3 py-1 rounded bg-gray-700 text-gray-100 hover:bg-gray-600 transition">Light</button>
          <button onclick="setTheme('dark')" class="px-3 py-1 rounded bg-gray-700 text-gray-100 hover:bg-gray-600 transition">Dark</button>
          <button onclick="setTheme('sepia')" class="px-3 py-1 rounded bg-gray-700 text-gray-100 hover:bg-gray-600 transition">Sepia</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Reader Body Panel -->
  <main class="container mx-auto px-6 py-12 flex-1 max-w-3xl">
    <!-- Unlocked Content View -->
    <div id="unlocked-view" class="hidden space-y-6">
      <div class="border-b border-gray-700/50 pb-6 mb-8">
        <h1 id="book-title" class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2 text-white transition-colors duration-200">Loading Title...</h1>
        <p id="book-author" class="text-lg text-gray-400 font-medium">Loading Author...</p>
      </div>

      <!-- The dynamic content injected with span marks -->
      <div id="reader-content" class="prose max-w-none transition-colors duration-200">
        <!-- Rendered paragraphs go here -->
      </div>
    </div>

    <!-- Locked Content / Access Denied View -->
    <div id="locked-view" class="hidden glass rounded-3xl p-8 text-center border border-gray-800 max-w-lg mx-auto my-12 bg-gray-900/60 shadow-2xl">
      <div class="text-5xl mb-4">🔒</div>
      <h2 class="text-2xl font-bold text-white mb-2">Book Content Locked</h2>
      <p class="text-gray-400 text-sm mb-6 leading-relaxed">
        This is a secure digital asset. You must purchase this work to read the content or listen to the audiobook.
      </p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <a href="browse.html" class="px-6 py-2.5 bg-gray-800 hover:bg-gray-750 text-gray-300 border border-gray-700 rounded-xl text-sm font-semibold transition">
          Browse Shelf
        </a>
        <a href="cart.html" class="px-6 py-2.5 bg-gradient-to-r from-cyan-600 to-emerald-600 hover:from-cyan-500 hover:to-emerald-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-emerald-950/40">
          Go to Cart
        </a>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="text-center py-24">
      <div class="w-12 h-12 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-gray-400 text-sm font-medium">Retrieving book copy...</p>
    </div>
  </main>

  <!-- Sticky Footer: Audiobook Controls Bar -->
  <footer id="audiobook-controls" class="hidden sticky bottom-0 z-40 bg-gray-900 border-t border-gray-800 text-gray-100 p-4 shadow-2xl">
    <div class="container mx-auto max-w-3xl flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Audio Progress Label -->
      <div class="text-left w-full md:w-auto">
        <p class="text-xs text-emerald-400 font-semibold tracking-wider uppercase mb-0.5">Narrator Voice Active</p>
        <p id="audio-progress-text" class="text-sm font-medium text-gray-200">Sentence 0 of 0</p>
      </div>

      <!-- Playback Actions -->
      <div class="flex items-center space-x-3">
        <button id="tts-stop" onclick="stopSpeech()" class="p-2.5 rounded-full bg-gray-800 hover:bg-gray-750 border border-gray-700 hover:text-rose-400 transition" title="Stop">
          ⏹ Stop
        </button>
        <button id="tts-play-pause" onclick="togglePlayPause()" class="px-6 py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-500 font-bold text-white shadow transition" title="Play / Pause">
          ▶ Play Speech
        </button>
      </div>

      <!-- Voice select and speed controls -->
      <div class="flex items-center space-x-4 w-full md:w-auto text-xs font-semibold">
        <!-- Voice Select -->
        <div class="flex flex-col">
          <label for="voice-select" class="text-[10px] text-gray-400 mb-1">Narrator Voice</label>
          <select id="voice-select" class="bg-gray-800 text-gray-200 border border-gray-700 rounded px-2 py-1 focus:ring-1 focus:ring-emerald-400 outline-none max-w-[150px]"></select>
        </div>

        <!-- Speed Slider -->
        <div class="flex flex-col">
          <label for="speed-slider" class="text-[10px] text-gray-400 mb-1">Speed: <span id="speed-val">1.0x</span></label>
          <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1.0" oninput="updateSpeedValue(this.value)" class="w-24 accent-emerald-400" />
        </div>
      </div>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get('bookId');
    const token = localStorage.getItem('echoreads_token');

    if (!token) {
      window.location.href = 'signin.html';
    }
    if (!bookId) {
      window.location.href = 'browse.html';
    }

    // TTS state variables
    let currentSentenceIndex = 1;
    let totalSentences = 0;
    let isSpeaking = false;
    let isPaused = false;
    let sentencesList = [];
    let activeUtterance = null;

    // Load voices dynamically
    function populateVoices() {
      const select = document.getElementById('voice-select');
      const voices = window.speechSynthesis.getVoices();
      select.innerHTML = '';
      voices.forEach(voice => {
        if (voice.lang.startsWith('en')) { // prioritize English voices
          const option = document.createElement('option');
          option.value = voice.name;
          option.textContent = `${voice.name} (${voice.lang})`;
          select.appendChild(option);
        }
      });
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
      populateVoices();
    }

    // Load secure content
    async function loadBookContent() {
      const spinner = document.getElementById('loading-spinner');
      const unlockedView = document.getElementById('unlocked-view');
      const lockedView = document.getElementById('locked-view');

      try {
        const response = await fetch(`/api/books/${bookId}/read`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        spinner.classList.add('hidden');

        if (response.status === 403) {
          lockedView.classList.remove('hidden');
          return;
        }

        const data = await response.json();
        if (data.success && data.data) {
          unlockedView.classList.remove('hidden');
          document.getElementById('audiobook-controls').classList.remove('hidden');
          
          document.getElementById('book-title').textContent = data.data.title;
          document.getElementById('book-author').textContent = `by ${data.data.author}`;
          
          // Process and split text into sentences for highlighting
          const text = data.data.content;
          const container = document.getElementById('reader-content');
          
          const { html, sentences } = parseTextToSentences(text);
          container.innerHTML = html;
          
          sentencesList = sentences;
          totalSentences = sentences.length;
          
          updateProgressText();

          // Scroll to bookmark if exists
          const bookmark = localStorage.getItem(`bookmark_${bookId}`);
          if (bookmark) {
            const index = parseInt(bookmark);
            if (index > 0 && index <= totalSentences) {
              currentSentenceIndex = index;
              setTimeout(() => {
                const el = document.getElementById(`s-${index}`);
                if (el) {
                  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  el.classList.add('border-b-2', 'border-emerald-400/50');
                }
              }, 500);
            }
          }
        } else {
          alert('Failed to load book data: ' + data.message);
        }
      } catch (err) {
        console.error('Error fetching book content:', err);
        spinner.classList.add('hidden');
        alert('Server network error loading reader.');
      }
    }

    // Parse book text body into paragraphs and interactive spans
    function parseTextToSentences(text) {
      const paragraphs = text.split(/\n\n+/);
      let sentenceIndex = 0;
      const sentences = [];

      const html = paragraphs.map(p => {
        if (!p.trim()) return '';
        // Split using sentence ending boundaries
        const rawSentences = p.match(/[^.!?]+[.!?]*\s*/g) || [p];
        const spanSentences = rawSentences.map(s => {
          if (!s.trim()) return '';
          sentenceIndex++;
          sentences.push(s.trim());
          return `<span id="s-${sentenceIndex}" onclick="jumpToSentence(${sentenceIndex})" class="reader-sentence cursor-pointer hover:bg-emerald-500/10 transition duration-150">${s}</span>`;
        }).join('');
        return `<p class="mb-6">${spanSentences}</p>`;
      }).join('');

      return { html, sentences };
    }

    function updateProgressText() {
      document.getElementById('audio-progress-text').textContent = `Sentence ${currentSentenceIndex} of ${totalSentences}`;
    }

    function updateSpeedValue(val) {
      document.getElementById('speed-val').textContent = `${val}x`;
      // If actively playing, restart sentence with new rate
      if (isSpeaking && !isPaused) {
        window.speechSynthesis.cancel();
        speakSentence(currentSentenceIndex);
      }
    }

    // Jump speech and view to clicked sentence
    function jumpToSentence(index) {
      currentSentenceIndex = index;
      updateProgressText();
      
      // Flash sentence highlight
      document.querySelectorAll('.reader-sentence').forEach(el => {
        el.classList.remove('border-b-2', 'border-emerald-400/50');
      });
      const el = document.getElementById(`s-${index}`);
      if (el) el.classList.add('border-b-2', 'border-emerald-400/50');

      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isPaused = false;
        speakSentence(index);
      } else {
        localStorage.setItem(`bookmark_${bookId}`, index);
      }
    }

    // Speak single sentence utterance
    function speakSentence(index) {
      if (!isSpeaking || index > totalSentences) {
        stopSpeech();
        return;
      }

      currentSentenceIndex = index;
      updateProgressText();
      localStorage.setItem(`bookmark_${bookId}`, index);

      // Highlight active text span
      document.querySelectorAll('.reader-sentence').forEach(el => {
        el.classList.remove('bg-amber-400/25', 'text-amber-900', 'text-amber-100', 'border-b-2', 'border-emerald-400/50');
      });

      const span = document.getElementById(`s-${index}`);
      if (span) {
        const isDarkTheme = document.body.classList.contains('theme-dark') || document.body.classList.contains('theme-sepia');
        span.classList.add('bg-amber-400/25', isDarkTheme ? 'text-amber-100' : 'text-amber-900');
        span.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      const text = sentencesList[index - 1];
      const utterance = new SpeechSynthesisUtterance(text);

      const voiceName = document.getElementById('voice-select').value;
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(v => v.name === voiceName);
      if (voice) utterance.voice = voice;

      const rate = parseFloat(document.getElementById('speed-slider').value);
      utterance.rate = rate;

      utterance.onend = () => {
        if (isSpeaking && !isPaused) {
          speakSentence(index + 1);
        }
      };

      utterance.onerror = (e) => {
        console.error('TTS execution error:', e);
      };

      activeUtterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    function togglePlayPause() {
      const btn = document.getElementById('tts-play-pause');

      if (!isSpeaking) {
        isSpeaking = true;
        isPaused = false;
        btn.textContent = '⏸ Pause Narration';
        btn.classList.replace('bg-emerald-600', 'bg-amber-600');
        btn.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-500');
        speakSentence(currentSentenceIndex);
      } else if (isPaused) {
        isPaused = false;
        btn.textContent = '⏸ Pause Narration';
        btn.classList.replace('bg-emerald-600', 'bg-amber-600');
        btn.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-500');
        speakSentence(currentSentenceIndex);
      } else {
        isPaused = true;
        btn.textContent = '▶ Resume Speech';
        btn.classList.replace('bg-amber-600', 'bg-emerald-600');
        btn.classList.replace('hover:bg-amber-500', 'hover:bg-emerald-500');
        window.speechSynthesis.cancel();
      }
    }

    function stopSpeech() {
      isSpeaking = false;
      isPaused = false;
      window.speechSynthesis.cancel();
      
      const btn = document.getElementById('tts-play-pause');
      btn.textContent = '▶ Play Speech';
      btn.classList.remove('bg-amber-600');
      btn.classList.add('bg-emerald-600');
      btn.classList.add('hover:bg-emerald-500');

      document.querySelectorAll('.reader-sentence').forEach(el => {
        el.classList.remove('bg-amber-400/25', 'text-amber-900', 'text-amber-100');
      });
    }

    // Aesthetic theme selector functions
    function setTheme(theme) {
      document.body.className = 'min-h-screen flex flex-col theme-' + theme;
    }

    function changeFontSize(delta) {
      const body = document.documentElement;
      let currentSize = parseFloat(getComputedStyle(body).getPropertyValue('--reader-font-size')) || 1.125;
      let newSize = Math.max(0.75, Math.min(2.5, currentSize + delta));
      body.style.setProperty('--reader-font-size', `${newSize}rem`);
    }

    document.addEventListener('DOMContentLoaded', loadBookContent);
  </script>
</body>
</html>
