<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Online Preview - EchoReads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:radial-gradient(at 70% 30%, #171730, #0a0a1a);color:#e2e8f0;font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-800/80 bg-slate-900/40 sticky top-0 z-40">
    <div class="container mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-amber-400">Echo<span class="text-white">Reads</span></a>
      <nav class="space-x-6 text-gray-300">
        <a class="hover:text-white" href="browse.html">Browse</a>
        <a class="hover:text-white" href="genres.html">Genres</a>
        <a class="hover:text-white" href="cart.html">Cart</a>
        <a class="hover:text-white" href="novia.html">Novia</a>
      </nav>
    </div>
  </header>
  <main class="container mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-4 gap-3">
      <div class="flex gap-2">
        <input id="q" class="w-72 bg-gray-700 rounded px-4 py-2 text-white" placeholder="Search by title or author" />
        <button id="go" class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-500">Search</button>
      </div>
      <div class="flex items-center gap-3">
        <label class="text-gray-300">Genre</label>
        <select id="genre" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-gray-200"></select>
        <label class="text-gray-300">Sort</label>
        <select id="sort" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-gray-200">
          <option value="latest">Latest</option>
          <option value="popular">Most Popular</option>
          <option value="rated">Highly Rated</option>
        </select>
      </div>
    </div>
    <div class="flex flex-col md:flex-row gap-6">
      <aside class="md:w-1/3">
        <div id="list" class="space-y-2"></div>
      </aside>
      <section class="md:w-2/3 bg-slate-800/60 rounded-lg p-6">
        <h1 id="title" class="text-3xl font-extrabold text-white"></h1>
        <p id="meta" class="text-gray-400 mb-4"></p>
        <div id="cover-wrapper" class="mb-4 hidden">
          <img id="cover" class="w-full max-h-72 object-contain rounded shadow-lg" alt="Book cover" />
        </div>
        <article id="content" class="whitespace-pre-wrap leading-7 text-gray-200"></article>
      </section>
    </div>
  </main>
  <script>
    const token = localStorage.getItem('echoreads_token');
    if (!token) {
        window.location.href = 'signin.html';
    }
    const API='/api';
    let ALL=[]; let VIEW=null; let CURR_GENRE=null;
    function renderList(items){
      const list=document.getElementById('list');
      list.innerHTML=items.map(b=>`
        <button class="w-full text-left p-3 bg-gray-800 hover:bg-gray-700 rounded flex gap-3" data-id="${b.id||b._id}">
          <div class="w-14 h-20 flex-shrink-0 rounded overflow-hidden bg-gray-700">
            ${b.imageUrl ? `<img src="${b.imageUrl}" alt="${b.title}" class="w-full h-full object-cover" />` : ''}
          </div>
          <div>
            <div class="text-white font-semibold line-clamp-2">${b.title}</div>
            <div class="text-gray-400 text-sm">${b.author}   ${b.genre}    ★ ${b.rating}</div>
          </div>
        </button>`).join('');
      list.querySelectorAll('button').forEach(btn=>btn.onclick=()=>openBook(btn.dataset.id));
    }
    async function load(){
      const sort=document.getElementById('sort').value||'latest';
      const genre=CURR_GENRE;
      const url = genre? `${API}/books?genre=${encodeURIComponent(genre)}&sort=${encodeURIComponent(sort)}`: `${API}/books?sort=${encodeURIComponent(sort)}`;
      const r=await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } }); const d=await r.json(); ALL=d.data||[]; renderList(ALL); if(ALL.length) openBook(ALL[0].id||ALL[0]._id);
    }
    async function openBook(id){ const r=await fetch(`${API}/books/${id}`, { headers: { 'Authorization': `Bearer ${token}` } }); const d=await r.json(); const b=d.data; VIEW=b; document.getElementById('title').textContent=b.title; document.getElementById('meta').textContent=`by ${b.author}   ${b.genre}    ★ ${b.rating} (${b.totalRatings})`; const coverWrapper=document.getElementById('cover-wrapper'); const coverImg=document.getElementById('cover'); if(b.imageUrl){ coverImg.src=b.imageUrl; coverImg.alt=b.title; coverWrapper.classList.remove('hidden'); } else { coverImg.removeAttribute('src'); coverWrapper.classList.add('hidden'); } document.getElementById('content').textContent=b.content||'Full text coming soon.'; window.scrollTo({top:0,behavior:'smooth'}); }
    function search(){ const q=document.getElementById('q').value.toLowerCase(); renderList(ALL.filter(b=> (b.title+b.author+b.genre).toLowerCase().includes(q))); }
    async function loadGenres(){ const r=await fetch(API+'/books/genres', { headers: { 'Authorization': `Bearer ${token}` } }); const d=await r.json(); const sel=document.getElementById('genre'); sel.innerHTML='<option value="">All</option>'+(d.data||[]).map(x=>`<option>${x}</option>`).join(''); sel.onchange=()=>{ CURR_GENRE=sel.value||null; load(); } }
    document.getElementById('go').onclick=search; document.getElementById('q').addEventListener('keypress',e=>{ if(e.key==='Enter') search(); });
    document.getElementById('sort').addEventListener('change',()=>load());
    (async ()=>{ await loadGenres(); await load(); })();
  </script>
</body>
</html>
